<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 35px 25px;
      border-radius: 25px;
      text-align: center;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      animation: pop 0.8s ease;
      position: relative;
      z-index: 2;
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      color: #ff4d6d;
      font-size: 32px;
      margin-bottom: 15px;
    }

    p {
      color: #444;
      font-size: 18px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: relative;
    }

    button {
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      font-size: 17px;
      cursor: pointer;
      transition: 0.3s;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
    }

    #yesBtn:hover {
      transform: scale(1.1);
      background: #ff2f5f;
    }

    #noBtn {
      background: #eee;
      color: #333;
      position: relative;
    }

    .heart {
      position: fixed;
      color: red;
      font-size: 24px;
      animation: float 4s linear infinite;
      z-index: 1;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.3);
        opacity: 0;
      }
    }

    .message {
      display: none;
      margin-top: 20px;
      color: #ff4d6d;
      font-size: 22px;
      font-weight: bold;
      animation: pop 0.6s ease;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>I Love You ❤️</h1>
    <p>
      I know I made mistakes before, but I promise I will not repeat them.
      You mean a lot to me. Will you be with me? 🥺I Love U. 
    </p>

    <div class="buttons">
      <button id="yesBtn">Yes ❤️</button>
      <button id="noBtn">No 😢</button>
    </div>

    <div class="message" id="message">
      Yayyy! You made me the happiest person ❤️🥰
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const message = document.getElementById("message");

    yesBtn.addEventListener("click", () => {
      message.style.display = "block";
      createManyHearts();
    });

    const card = document.querySelector(".card");

document.addEventListener("mousemove", (e) => {
  const rect = noBtn.getBoundingClientRect();

  const btnX = rect.left + rect.width / 2;
  const btnY = rect.top + rect.height / 2;

  const distance = Math.sqrt(
    Math.pow(e.clientX - btnX, 2) +
    Math.pow(e.clientY - btnY, 2)
  );

  // Cursor comes near button
  if (distance < 120) {
    const moveX = (Math.random() - 0.5) * 250;
    const moveY = (Math.random() - 0.5) * 200;

    noBtn.style.transform =
      `translate(${moveX}px, ${moveY}px) scale(0.7)`;

    noBtn.style.transition = "0.2s";
  } else {
    noBtn.style.transform = "scale(1)";
  }
});

    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 2 + 3 + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    function createManyHearts() {
      for (let i = 0; i < 35; i++) {
        setTimeout(createHeart, i * 80);
      }
    }

    setInterval(createHeart, 700);
  </script>
</body>
</html>
